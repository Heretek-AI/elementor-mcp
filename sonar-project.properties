# SonarCloud analysis scope for Heretek-AI_elementor-mcp.
#
# The PHP quality profile deactivates the camelCase naming rules (php:S100 /
# php:S101 / php:S116) and "too many returns" (php:S1142) because this is a
# WordPress plugin: snake_case function/class names and WP_Error-guard early
# returns are the platform convention. php:S3776 (cognitive complexity) runs
# with a raised threshold so only genuinely huge functions flag.
#
# The standalone test harnesses under tests/ deliberately mirror WordPress core
# function names (wp_normalize_path, esc_url, get_results, ...) so they can run
# without a database; analysing them as app code produces only noise, so they
# are excluded here. vendor/ holds committed Composer runtime deps.
sonar.projectKey=Heretek-AI_elementor-mcp
sonar.projectName=Heretek-AI elementor-mcp
sonar.sourceEncoding=UTF-8
sonar.exclusions=tests/**,**/vendor/**
